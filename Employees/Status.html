<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สถานะพนักงาน | TOKAI</title>

<link rel="preconnect" href="https://dhgjbpvbbixipxksqqzu.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://dhgjbpvbbixipxksqqzu.supabase.co">

<style>
  :root{
    --red:#F50602;
    --green:#1ea31e;
    --bg:#0b0b0c;
    --card:#161616;
    --row:#131313;
    --border:#2a2a2a;
    --text:#f2f2f2;
    --muted:#8a8a8a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(245,6,2,.10), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(245,6,2,.06), transparent 45%);
  }
  .wrap{max-width:760px;margin:0 auto}

  header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;flex-wrap:wrap;gap:10px;
  }
  header h1{font-size:19px;font-weight:700}
  header .meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .live-dot{
    width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(30,163,30,.6);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(30,163,30,.5)}
    70%{box-shadow:0 0 0 6px rgba(30,163,30,0)}
    100%{box-shadow:0 0 0 0 rgba(30,163,30,0)}
  }

  .summary{
    display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;
  }
  .summary .box{
    flex:1;min-width:120px;
    background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;
  }
  .summary .box .num{font-size:24px;font-weight:800}
  .summary .box .label{font-size:12px;color:var(--muted);margin-top:2px}
  .summary .online .num{color:var(--green)}
  .summary .offline .num{color:var(--muted)}

  input#search{
    width:100%;padding:11px 14px;margin-bottom:14px;
    background:var(--card);border:1.5px solid var(--border);
    border-radius:10px;color:var(--text);font-size:14px;
  }
  input#search:focus{outline:none;border-color:var(--red)}

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;overflow:hidden;
  }
  table{width:100%;border-collapse:collapse}
  th{
    text-align:left;font-size:12px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.4px;
    padding:12px 16px;border-bottom:1px solid var(--border);
  }
  td{padding:13px 16px;font-size:14px;border-bottom:1px solid #1c1c1c}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--row)}

  .badge{
    display:inline-flex;align-items:center;gap:6px;
    padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:700;
  }
  .badge.online{background:rgba(30,163,30,.15);color:#7ee87e}
  .badge.offline{background:rgba(138,138,138,.15);color:var(--muted)}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .badge.online .dot{background:#7ee87e}
  .badge.offline .dot{background:var(--muted)}

  .empty, .loading, .error{
    padding:40px 20px;text-align:center;color:var(--muted);font-size:14px;
  }
  .error{color:#ff8580}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>พนักงานที่ออนไลน์อยู่ตอนนี้</h1>
    <div class="meta">
      <span class="live-dot"></span>
      <span id="last-update">กำลังโหลด...</span>
    </div>
  </header>

  <div class="summary">
    <div class="box online">
      <div class="num" id="count-online">-</div>
      <div class="label">ออนไลน์อยู่ตอนนี้</div>
    </div>
  </div>

  <input type="text" id="search" placeholder="ค้นหารหัสพนักงานหรือชื่อ...">

  <div class="card">
    <table id="tbl" style="display:none">
      <thead>
        <tr>
          <th>รหัสพนักงาน</th>
          <th>ชื่อ</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="state" class="loading">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";

  const SUPABASE_URL  = "https://dhgjbpvbbixipxksqqzu.supabase.co";
  const SUPABASE_KEY  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRoZ2picHZiYml4aXB4a3NxcXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5OTIxMjgsImV4cCI6MjEwMTU2ODEyOH0.kZBAN01vbe8kENacfofZewHvxQBCCd2OaTFKbcFYlpM";
  const REFRESH_MS    = 15000; // รีเฟรชทุก 15 วินาที

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const tbl = document.getElementById('tbl');
  const tbody = document.getElementById('tbody');
  const stateEl = document.getElementById('state');
  const lastUpdateEl = document.getElementById('last-update');
  const searchEl = document.getElementById('search');
  const countOnlineEl = document.getElementById('count-online');

  let allRows = [];

  function render(){
    const q = searchEl.value.trim().toLowerCase();
    const rows = q
      ? allRows.filter(r =>
          (r.employee_code || '').toLowerCase().includes(q) ||
          (r.employee_name || '').toLowerCase().includes(q))
      : allRows;

    if (rows.length === 0){
      tbl.style.display = 'none';
      stateEl.style.display = 'block';
      stateEl.className = 'empty';
      stateEl.textContent = q ? 'ไม่พบข้อมูลที่ค้นหา' : 'ตอนนี้ไม่มีพนักงานออนไลน์อยู่';
      return;
    }

    tbl.style.display = '';
    stateEl.style.display = 'none';

    tbody.innerHTML = rows.map(r => {
      return '<tr>' +
        '<td>' + escapeHtml(r.employee_code) + '</td>' +
        '<td>' + escapeHtml(r.employee_name || '-') + '</td>' +
      '</tr>';
    }).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  async function loadData(){
    try {
      const { data, error } = await supabase.rpc('list_employee_status');

      if (error){
        stateEl.className = 'error';
        stateEl.textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + error.message;
        stateEl.style.display = 'block';
        tbl.style.display = 'none';
        return;
      }

      // แสดงเฉพาะพนักงานที่สถานะ Online เท่านั้น
      allRows = (data || []).filter(r => r.status === 'Online');
      countOnlineEl.textContent = allRows.length;

      render();

      const now = new Date();
      lastUpdateEl.textContent = 'อัปเดตล่าสุด ' + now.toLocaleTimeString('th-TH');

    } catch (err){
      stateEl.className = 'error';
      stateEl.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
      stateEl.style.display = 'block';
      tbl.style.display = 'none';
    }
  }

  searchEl.addEventListener('input', render);

  loadData();
  setInterval(loadData, REFRESH_MS);
})();
</script>
</body>
</html>
